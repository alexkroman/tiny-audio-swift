# Install with: pre-commit install
#
# `swift-test` is the slow hook (multi-minute first build because of MLX-Swift).
# To move it to pre-push instead, change its `stages` to `[pre-push]` and run
# `pre-commit install --hook-type pre-push`.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: swift-format
        name: swift-format lint
        entry: xcrun swift-format lint --strict --recursive swift/Sources swift/Tests
        language: system
        types: [swift]
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.+\.ya?ml$
        pass_filenames: false

      - id: prettier
        name: prettier --check
        entry: prettier --check
        language: system
        types_or: [yaml, markdown]

      - id: swift-test
        name: swift test
        entry: scripts/run-swift-test.sh
        language: system
        types: [swift]
        pass_filenames: false
        stages: [pre-push]

      - id: swift-e2e
        name: swift e2e (TINY_AUDIO_E2E=1)
        entry: scripts/run-e2e-tests.sh
        language: system
        types: [swift]
        pass_filenames: false
        stages: [pre-push]
